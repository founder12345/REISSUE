services:
  db:
    image: postgres:17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: reissue
      POSTGRES_USER: reissue
      POSTGRES_PASSWORD: local-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U reissue -d reissue"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - archive:/var/lib/postgresql/data
volumes:
  archive:
